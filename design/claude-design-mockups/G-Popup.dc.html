<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Global · email signup popup states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="dv.css">
<link rel="stylesheet" href="site.css">
<script src="dvdata.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="board" style="width: 3040px; height: 3280px; display: flex; flex-direction: column; gap: 80px">
<div class="board-row">
<div class="board-col" style="width: 1440px"><div class="board-l"><b>Desktop · Default</b><span>centred split modal</span></div><div class="frame" style="width: 1440px; height: 900px"><dc-import name="Popup" width="1440" state="default" palette="{{palette}}" hint-size="1440px,900px"></dc-import></div></div>
<div class="board-col" style="width: 1440px"><div class="board-l"><b>Desktop · Invalid email</b><span>inline error</span></div><div class="frame" style="width: 1440px; height: 900px"><dc-import name="Popup" width="1440" state="error" palette="{{palette}}" hint-size="1440px,900px"></dc-import></div></div>
</div>
<div class="board-row">
<div class="board-col" style="width: 1440px"><div class="board-l"><b>Desktop · Loading</b><span>button busy</span></div><div class="frame" style="width: 1440px; height: 900px"><dc-import name="Popup" width="1440" state="loading" palette="{{palette}}" hint-size="1440px,900px"></dc-import></div></div>
<div class="board-col" style="width: 1440px"><div class="board-l"><b>Desktop · Success</b><span>code VAI10</span></div><div class="frame" style="width: 1440px; height: 900px"><dc-import name="Popup" width="1440" state="success" palette="{{palette}}" hint-size="1440px,900px"></dc-import></div></div>
</div>
<div class="board-row">
<div class="board-col" style="width: 390px"><div class="board-l"><b>Mobile · Default</b><span>bottom sheet</span></div><div class="frame" style="width: 390px; height: 844px"><dc-import name="Popup" width="390" state="default" palette="{{palette}}" hint-size="390px,844px"></dc-import></div></div>
<div class="board-col" style="width: 390px"><div class="board-l"><b>Mobile · Error</b></div><div class="frame" style="width: 390px; height: 844px"><dc-import name="Popup" width="390" state="error" palette="{{palette}}" hint-size="390px,844px"></dc-import></div></div>
<div class="board-col" style="width: 390px"><div class="board-l"><b>Mobile · Loading</b></div><div class="frame" style="width: 390px; height: 844px"><dc-import name="Popup" width="390" state="loading" palette="{{palette}}" hint-size="390px,844px"></dc-import></div></div>
<div class="board-col" style="width: 390px"><div class="board-l"><b>Mobile · Success</b></div><div class="frame" style="width: 390px; height: 844px"><dc-import name="Popup" width="390" state="success" palette="{{palette}}" hint-size="390px,844px"></dc-import></div></div>
<div class="board-col" style="width: 768px"><div class="board-l"><b>Tablet · Default</b><span>split modal</span></div><div class="frame" style="width: 768px; height: 1024px"><dc-import name="Popup" width="768" state="default" palette="{{palette}}" hint-size="768px,1024px"></dc-import></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sage","harbour","clay","olive"],"default":"sage"},"$preview":{"width":3040,"height":3280}}'>
class Component extends DCLogic {
  renderVals() { return { palette: this.props.palette ?? 'sage' }; }
}
</script>
</body>
</html>
