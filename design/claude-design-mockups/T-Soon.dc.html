<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coming soon (generic) · 390 / 768 / 1440</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="dv.css">
<link rel="stylesheet" href="site.css">
<script src="dvdata.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="board" style="width: 2838px; height: 1950px">
<div class="board-row">
<div class="board-col" style="width: 390px"><div class="board-l"><b>Mobile</b><span>390 px</span></div><div class="frame" style="width: 390px"><dc-import name="Screen" route="soon" width="390" palette="{{palette}}" hint-size="390px,1650px"></dc-import></div></div>
<div class="board-col" style="width: 768px"><div class="board-l"><b>Tablet</b><span>768 px</span></div><div class="frame" style="width: 768px"><dc-import name="Screen" route="soon" width="768" palette="{{palette}}" hint-size="768px,1400px"></dc-import></div></div>
<div class="board-col" style="width: 1440px"><div class="board-l"><b>Desktop</b><span>1440 px</span></div><div class="frame" style="width: 1440px"><dc-import name="Screen" route="soon" width="1440" palette="{{palette}}" hint-size="1440px,1150px"></dc-import></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sage","harbour","clay","olive"],"default":"sage"},"$preview":{"width":2838,"height":1950}}'>
class Component extends DCLogic {
  renderVals() { return { palette: this.props.palette ?? 'sage' }; }
}
</script>
</body>
</html>
