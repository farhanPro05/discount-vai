<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Global · product card states (Option D)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="dv.css">
<link rel="stylesheet" href="site.css">
<script src="dvdata.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="board" style="width: 1592px; height: 720px">
<div class="board-row" style="gap: 40px">
<div class="board-col" style="width: 348px"><div class="board-l"><b>Default</b><span>full price</span></div><div class="frame"><dc-import name="Card" pid="17" palette="{{palette}}" hint-size="348px,540px"></dc-import></div></div>
<div class="board-col" style="width: 348px"><div class="board-l"><b>On sale</b><span>-% badge, struck price</span></div><div class="frame"><dc-import name="Card" pid="15" palette="{{palette}}" hint-size="348px,540px"></dc-import></div></div>
<div class="board-col" style="width: 348px"><div class="board-l"><b>New</b><span>NEW badge</span></div><div class="frame"><dc-import name="Card" pid="28" palette="{{palette}}" hint-size="348px,540px"></dc-import></div></div>
<div class="board-col" style="width: 348px"><div class="board-l"><b>Sold out</b><span>dimmed photo</span></div><div class="frame"><dc-import name="Card" pid="24" palette="{{palette}}" hint-size="348px,540px"></dc-import></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["sage","harbour","clay","olive"],"default":"sage"},"$preview":{"width":1592,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return { palette: this.props.palette ?? 'sage' }; }
}
</script>
</body>
</html>
